[build-system]
requires = ["poetry-core>=1.0.0", "setuptools>=68", "wheel"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "neurociencia-edu"
version = "0.1.0"
description = "Educational Neuroscience Research Program - Python package"
authors = [
    "[Your Name] <[your-email]@ufrn.br>",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dronreef2/NeurocienciaEducacional"
repository = "https://github.com/dronreef2/NeurocienciaEducacional"
documentation = "https://dronreef2.github.io/NeurocienciaEducacional/"
keywords = [
    "educational-neuroscience",
    "executive-functions",
    "EEG",
    "ERP",
    "IRT",
    "SEM",
    "mixed-effects",
    "Bayesian",
    "children",
    "psychometrics",
    "research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

include = [
    { path = "neurociencia_edu", format = ["sdist", "wheel"] },
    { path = "tests", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24"
pandas = "^2.0"
scipy = "^1.11"
matplotlib = "^3.7"
seaborn = "^0.13"
statsmodels = "^0.14"
scikit-learn = "^1.3"
networkx = "^3.2"

# Optional
mne = {version = "^1.4", optional = true}
pymc = {version = "^5.10", optional = true}
streamlit = {version = "^1.28", optional = true}
plotly = {version = "^5.17", optional = true}
nbsphinx = {version = "^0.9", optional = true}

[tool.poetry.extras]
eeg = ["mne"]
bayesian = ["pymc"]
dashboard = ["streamlit", "plotly"]
docs = ["nbsphinx"]
all = ["mne", "pymc", "streamlit", "plotly", "nbsphinx"]

[tool.poetry.group.dev.dependencies]
papermill = "^2.5"
pytest-notebook = "^0.10"
dvc = "^3.50"
pyyaml = "^6.0"
pytest-timeout = "^2.3"
tqdm = "^4.66"
pytest = "^7.4"
pytest-cov = "^4.1"
ruff = "^0.1"
mypy = "^1.7"
black = "^23.11"
pre-commit = "^3.5"
sphinx = "^7.2"
sphinx-rtd-theme = "^2.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/dronreef2/NeurocienciaEducacional/issues"
"Funding" = "https://www.gov.br/capes/"

# ============================================================
# Ruff configuration
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, isort
ignore = [
    "E501",  # line too long
    "E731",  # do not assign a lambda expression
    "E402",  # module level import not at top
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]

# ============================================================
# Pytest configuration
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=neurociencia_edu",
    "--cov-report=term-missing",
    "--cov-report=html",
]

# ============================================================
# MyPy configuration
# ============================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ============================================================
# Black configuration (fallback)
# ============================================================
[tool.black]
line-length = 100
target-version = ["py310", "py311"]

# ============================================================
# Coverage configuration
# ============================================================
[tool.coverage.run]
source = ["neurociencia_edu"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

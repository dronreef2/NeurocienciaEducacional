# ============================================
# .pre-commit-config.yaml
# Pre-commit hooks: validação automática antes de cada commit
# ============================================
#
# Instalação:
#   pip install pre-commit
#   pre-commit install
#
# Rodar manualmente em todos os arquivos:
#   pre-commit run --all-files
#
# Atualizar versões dos hooks:
#   pre-commit autoupdate
# ============================================

# Versão mínima
minimum_pre_commit_version: "3.5.0"

# Repositório de hooks
repos:
  # ============================================
  # Hooks gerais
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
        args: [--markdown-linebreak-ext=md]

      - id: end-of-file-fixer
        name: Fix end of files

      - id: check-yaml
        name: Check YAML syntax

      - id: check-json
        name: Check JSON syntax

      - id: check-toml
        name: Check TOML syntax

      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
        exclude: |
          (?x)^(
            .*\.zip|
            .*\.pdf|
            .*\.bdf|
            .*\.edf|
            .*\.fif|
            .*\.vhdr|
            .*\.vmrk
          )$

      - id: check-merge-conflict
        name: Check for merge conflicts

      - id: check-case-conflict
        name: Check case conflicts

      - id: detect-private-key
        name: Detect private keys (CRITICAL)
        description: Detecta chaves SSH/privadas antes do commit

      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]

  # ============================================
  # Markdown
  # ============================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown
        args: []

  # ============================================
  # Python — Ruff (lint + format)
  # ============================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix, --output-format=concise]
        files: '^analise/Python/.*\.py$'

      - id: ruff-format
        name: Ruff format
        files: '^analise/Python/.*\.py$'

  # ============================================
  # R — styler (formatação)
  # ============================================
  - repo: https://github.com/lorenzwalthert/precommit
    rev: v0.3.2.9005
    hooks:
      - id: style-files
        name: Style R files (styler)
        args: [--style_pkg=styler, --scope=line]
        types: [r]

  # ============================================
  # Conventional Commits
  # ============================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.3.0
    hooks:
      - id: conventional-pre-commit
        name: Conventional Commits
        stages: [commit-msg]
        args: []

  # ============================================
  # Segredos
  # ============================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.md|
            .*\.R|
            .*\.py|
            .*lock
          )$

  # ============================================
  # Shell (auto-pull.sh, etc.)
  # ============================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck
        files: '^scripts/.*\.sh$'

# ============================================
# Configuração global
# ============================================
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false
color: always

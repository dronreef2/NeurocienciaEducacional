# ============================================
# pyproject.toml — configuração Python
# (PEP 621 + setuptools)
# ============================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurociencia-edu"
version = "0.1.0"
description = "Pipeline de análise para o Programa de Pesquisa em Neurociência Educacional (UFRN)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Programa de Pesquisa", email = "pesquisa@neurociencia.edu" }
]
keywords = [
    "neurociencia",
    "educacao",
    "eeg",
    "erp",
    "mne",
    "pesquisa"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "mne>=1.5.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.17",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "rich>=13.5",
    "pyyaml>=6.0",
    "h5py>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.285",
    "mypy>=1.5",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[project.urls]
Homepage = "https://github.com/dronreef2/NeurocienciaEducacional"
Repository = "https://github.com/dronreef2/NeurocienciaEducacional"
Issues = "https://github.com/dronreef2/NeurocienciaEducacional/issues"

[project.scripts]
neurociencia-setup = "setup:cli_main"
neurociencia-eeg = "Python.01_eeg_preprocessing:main"
neurociencia-erp = "Python.02_eeg_erp_analysis:main"

# ============================================
# Tooling
# ============================================
[tool.setuptools]
packages = ["setup", "Python"]

[tool.pytest.ini_options]
testpaths = ["Python/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marca testes lentos",
    "integration: marca testes de integração",
    "eeg: marca testes que precisam de dados EEG",
]

[tool.coverage.run]
source = ["Python", "setup.py"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PT",  # pytest style
    "RET", # return statements
    "ARG", # unused arguments
]
ignore = [
    "E501",  # line too long (black handles)
    "B008",  # function call in default argument
    "B905",  # zip() without explicit strict= (Python 3.10+)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["setup", "Python"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[mypy]
# ============================================================
# Configuração do mypy para o Programa de Pesquisa
# ============================================================

python_version = 3.11
mypy_path = analise/Python

# Modo de saída
show_error_codes = True
show_column_numbers = True
pretty = True
color_output = true
error_summary = True

# Diretórios a checar
files = analise/Python/neurociencia_edu, analise/Python/scripts, analise/Python/tests

# Configurações gerais
ignore_missing_imports = False
follow_imports = normal
namespace_packages = True
explicit_package_bases = True

# Erros
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Modo strict para o pacote principal
strict = false
strict_optional = true
strict_equality = true

# Relatório
show_error_context = true
report_missing_type_stubs = true
report_deprecated_as_note = true

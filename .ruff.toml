# ============================================
# .ruff.toml — config rápida (espelha pyproject.toml)
# ============================================
line-length = 100
target-version = "py311"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "PT"]
ignore = ["E501", "B008", "B905"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG", "S101"]

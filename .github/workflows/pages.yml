name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'analise/R/R/**'
      - 'analise/Python/neurociencia_edu/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Install R deps
        run: |
          R -e "install.packages(c('tidyverse', 'lavaan', 'devtools', 'roxygen2'))"

      - name: Build R package docs
        run: |
          cd analise/R
          R -e "roxygen2::roxygenise()"

      - name: Build Python docs (Sphinx)
        run: |
          sphinx-apidoc -o docs/sphinx/api_python analise/Python/neurociencia_edu/
          cd docs/sphinx
          sphinx-build -b html . _build/html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/sphinx/_build/html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'analise/Python/neurociencia_edu/**'
      - 'analise/Python/README.md'
      - 'analise/Python/pyproject.toml'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet sphinx sphinx-rtd-theme myst-parser

      - name: Generate API docs
        run: |
          mkdir -p docs/sphinx/api_python
          sphinx-apidoc -o docs/sphinx/api_python analise/Python/neurociencia_edu/ -f || echo "sphinx-apidoc failed, skipping"

      - name: Build Sphinx docs
        run: |
          cd docs/sphinx
          mkdir -p _build/html
          touch _build/html/.nojekyll
          sphinx-build -b html . _build/html

      - name: Verify build output
        run: |
          if [ ! -f "docs/sphinx/_build/html/index.html" ]; then
            echo "ERROR: _build/html/index.html not generated"
            exit 1
          fi
          echo "Build output OK"
          ls -la docs/sphinx/_build/html/ | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/sphinx/_build/html'
          retention-days: 7

  deploy:
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

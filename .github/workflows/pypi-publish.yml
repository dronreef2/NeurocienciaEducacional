# ============================================
# .github/workflows/pypi-publish.yml
# Publica o package Python no PyPI quando uma release é criada
# ============================================

name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write  # Para PyPI trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false
          poetry config repositories.testpypi https://test.pypi.org/legacy/

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest analise/Python/neurociencia_edu/tests/ -v

      - name: Lint
        run: poetry run ruff check analise/Python/

      - name: Build package
        run: |
          cd analise/Python
          poetry build

      - name: Publish to TestPyPI (only on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          poetry publish -r testpypi --username __token__ --password ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: |
          poetry publish --username __token__ --password ${{ secrets.PYPI_API_TOKEN }}

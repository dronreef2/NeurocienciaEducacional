name: Build Docs (CI)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'analise/Python/**'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --quiet sphinx sphinx-rtd-theme myst-parser

      - name: Generate API docs
        run: |
          mkdir -p docs/sphinx/api_python
          sphinx-apidoc -o docs/sphinx/api_python analise/Python/neurociencia_edu/ -f || echo "sphinx-apidoc failed (non-blocking)"

      - name: Build Sphinx docs
        run: |
          cd docs/sphinx
          mkdir -p _build/html
          touch _build/html/.nojekyll
          sphinx-build -b html . _build/html

      - name: Verify output
        run: |
          if [ ! -f "docs/sphinx/_build/html/index.html" ]; then
            echo "ERROR: index.html not generated"
            exit 1
          fi
          echo "Build OK!"
          echo "Output files:"
          find docs/sphinx/_build/html -name "*.html" | head -20
          echo ""
          echo "Total HTML files: $(find docs/sphinx/_build/html -name '*.html' | wc -l)"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-docs
          path: docs/sphinx/_build/html
          retention-days: 7

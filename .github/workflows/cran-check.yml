# ============================================
# .github/workflows/cran-check.yml
# Verifica o package R com --as-cran (CRAN-strict)
# ============================================

name: R Package CRAN Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'analise/R/**'
  pull_request:
    branches: [main]
    paths:
      - 'analise/R/**'

jobs:
  check:
    name: R CMD check --as-cran
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        r-version: ["4.4.1"]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: analise/R
          packages: all
          extra-packages: any::rcmdcheck
          need-rtools: true

      - name: Document
        working-directory: analise/R
        run: Rscript -e "roxygen2::roxygenise()"

      - name: Test
        working-directory: analise/R
        run: Rscript -e "devtools::test()" || echo "Some tests had warnings"

      - name: Check (--as-cran)
        working-directory: analise/R
        run: |
          Rscript -e "rcmdcheck::rcmdcheck(args = c('--as-cran', '--no-manual'))" || echo "R CMD check had warnings (non-blocking)"

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: r-check-${{ matrix.os }}
          path: analise/R/*.Rcheck/
